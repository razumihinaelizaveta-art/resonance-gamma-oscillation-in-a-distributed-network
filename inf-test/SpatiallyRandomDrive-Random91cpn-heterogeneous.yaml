geometry:
    # brain area to simulate neurons in
    L: 750
    H: 750


populations:
    pvbc:
        dencity: 3600e-6*1.5
        num_neurons: L*H*dencity   # formula to compute dencity, however number also may be used
        
        # If you want to add some constant, write it here in the format const: value (or formula)
        const:
            modelbase: json.load( open("pvbc-ViaEtAl2022-RomanDB.json") ) # reading model base for PV+ basket cell
            neuronid :  np.random.randint(modelbase["number_of_models"],size=num_neurons) # randomly distribute model parameters through population
            eps: 1.e-9*mV
            
            FactorScaleKV3: 1

            norm_syn: 1*msiemens
            tau_syn_a: 0.8
            tau_syn_b: 2
            #tau_syn_b: 3.7

            ENa: 50*mV
            EK: -90*mV
            Esyn: -75*mV

            km2: 0.1
            kh1: 0.012
            kh2: 0.2
            kn1: 1.0*FactorScaleKV3
            kn2: 0.001*FactorScaleKV3
            ka2: 0.02

            sigm1: 4.0*mV
            sigm2: -13.0*mV

            sigh1: -20.0*mV
            sigh2: 3.5*mV

            sign1: 12.0*mV
            sign2: -8.5*mV

            siga1: 12.0*mV
            siga2: -80.0*mV

            # Parameters below are different in the heterogeneous network
            #gL: 14.705184211981187*nS
            #EL: -71.97508650437244*mV
            #taum: 5.222681687884308310*ms
            #Rin: 1.0e3/(gL/nS)*Mohm
            #Cap: taum/Rin

            #gNa: 16804.9678*nS
            #gKv3: 631.700393*nS
            #gKv1: 59.0431313*nS

            #thm1: -52.9951244*mV
            #thh2: -55.7111801*mV
            #thn1: 5.90077045*mV
            #tha1: 51.3553887*mV
            gLs  : 'np.array(modelbase["gL"])[neuronid]*nS'
            Rin  : '1000.0/(gLs/nS)*Mohm'
            taums: 'np.array(modelbase["taum"])[neuronid]*ms'
            Els  : np.array(modelbase["EL"])[neuronid]*mV
            
        # If you want to add some equation, write it here, but be sure after last equation new line is present
        equations:
            gat_vars: |
                alpham = 1.0/exprel(-(v-thm1-eps)/sigm1)/ms : Hz
                betam = km2*exp(v/sigm2)/ms : Hz
                dm/dt = alpham*(1-m) - betam*m : 1
                
                alphah = kh1*exp(v/sigh1)/ms : Hz
                betah = kh2*(sigh2/mV)/exprel(-(v-thh2)/sigh2)/ms : Hz
                dh/dt = alphah*(1-h) - betah*h : 1
                
                alphan = kn1*(sign1/mV)/exprel(-(v-thn1)/sign1)/ms : Hz
                betan = kn2*exp(v/sign2)/ms : Hz
                dn/dt = alphan*(1-n) - betan*n : 1
                
                alphaa = (siga1/mV)/exprel(-(v-tha1)/siga1)/ms : Hz
                betaa = ka2*exp(v/siga2)/ms : Hz
                da/dt = alphaa*(1-a) - betaa*a : 1
                
                INa = -gNa*m**3*h*(v-ENa) : ampere
                IKv3 = -gKv3*n**4*(v-EK) : ampere
                IKv1 = -gKv1*a**4*(v-EK) : ampere
                IL   = -gL*(v-EL) : ampere
                
                taum : second
                EL   : volt
                gL   : siemens
                Cap  : farad
                gNa  : siemens
                gKv3 : siemens
                gKv1 : siemens
                thm1 : volt
                thh2 : volt
                thn1 : volt
                tha1 : volt


            ext_eqs: |
                Isin   : ampere
                Inoise : ampere
                I0     : ampere
                Ibase  : 1 # initial Iapp distribution
                I=I0+Isin*cos(t/ms * 2*pi/200)+Inoise*rand() : ampere (constant over dt)

            eqs_syn: |
                Isyn = norm_syn*(synb-syna)*(Esyn-v) : amp
                dsyna/dt = -syna/tau_syn_a/ms : 1
                dsynb/dt = -synb/tau_syn_b/ms : 1

            volt_eqs: |
                dv/dt = (  INa + IKv1 + IKv3 + IL + I + Isyn )/Cap : volt 

            # gathering all equations together
            general_equ: volt_eqs + gat_vars + ext_eqs +  eqs_syn

        specs:
            method: exponential_euler
            threshold: v>-30*mV
            refractory: v>=-30*mV
        initials:
            v: Els + rnd.random(num_neurons)*10*mV
            m: 0.01
            h: 0.99
            n: 0.01
            a: 0.01
            # implementing heterogeneity
            taum : taums
            EL   : Els
            gL   : gLs
            Cap  : taums/Rin
            gNa  : np.array(modelbase["gNa" ])[neuronid]*nS
            gKv3 : np.array(modelbase["gKv3"])[neuronid]*nS
            gKv1 : np.array(modelbase["gKv1"])[neuronid]*nS
            thm1 : np.array(modelbase["thm1"])[neuronid]*mV
            thh2 : np.array(modelbase["thh2"])[neuronid]*mV
            thn1 : np.array(modelbase["thn1"])[neuronid]*mV
            tha1 : np.array(modelbase["tha1"])[neuronid]*mV

            Ibase: (229 + np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150)*30).tolist()
            I0: Ibase*pA if rnd.shuffle( Ibase ) is None else Ibase*pA
            Isin: 0*pA #229*pA + np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150)*40*pA
            Inoise: 0*pA #70*pA
            #Isin: 30*pA*np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150)
            #Isin: np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150)*30*pA



                           
synapses:
    pv2pv:
        source: 'pvbc'     # this is the name of predifined neuron group in this file
        target: 'pvbc'     # this is the name of predifined neuron group in this file
        general:
            model: 'gsyn:1'
            on_pre: |
                    syna_post += gsyn
                    synb_post += gsyn     
        geometry:
           type: 'random'
           probability: 0.0302930523
        conductance:
            type: 'linear'
            offset: 2.071919982188888e-05
            slope: 0.0
        delay:
            type: 'constant'
            delay: 3.6520970700302464
            
        
