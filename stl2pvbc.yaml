geometry:
    # brain area to simulate neurons in
    #L: 750
    #H: 750
    L: 300
    H: 300
    #L: 150
    #H: 150


populations:
    pvbc:
        dencity: 3600e-6*1.5
        num_neurons: L*H*dencity   # formula to compute dencity, however number also may be used
        
        # this model for layer II/II parvalbumin-positive + fast spiking basket of the medial entorhinal cortex
        # from https://doi.org/10.1371/journal.pcbi.1010094

        const:
            modelbase: json.load( open("pvbc-ViaEtAl2022-RomanDB.json") ) # reading model base for PV+ basket cell
            neuronid :  np.random.randint(modelbase["number_of_models"],size=num_neurons) # randomly distribute model parameters through population
            eps: 1.e-9*mV
            
            FactorScaleKV3: 1

            norm_syn_inh : 1*msiemens
            tau_syn_a_inh: 0.38 # from https://doi.org/10.1523/ENEURO.0441-21.2022
            tau_syn_b_inh: 2

            norm_syn_exc : 1*msiemens
            tau_syn_a_exc: 0.8 # need to find real number here
            tau_syn_b_exc: 2

            ENa: 50*mV
            EK: -90*mV
            Esyn_inh: -75*mV
            Esyn_exc: 0*mV

            km2: 0.1
            kh1: 0.012
            kh2: 0.2
            kn1: 1.0*FactorScaleKV3
            kn2: 0.001*FactorScaleKV3
            ka2: 0.02

            sigm1: 4.0*mV
            sigm2: -13.0*mV

            sigh1: -20.0*mV
            sigh2: 3.5*mV

            sign1: 12.0*mV
            sign2: -8.5*mV

            siga1: 12.0*mV
            siga2: -80.0*mV

            gLs  : 'np.array(modelbase["gL"])[neuronid]*nS'
            Rin  : '1000.0/(gLs/nS)*Mohm'
            taums: 'np.array(modelbase["taum"])[neuronid]*ms'
            Els  : 'np.array(modelbase["EL"])[neuronid]*mV'

        equations:
            gat_vars: |
                alpham = 1.0/exprel(-(v-thm1-eps)/sigm1)/ms : Hz
                betam = km2*exp(v/sigm2)/ms : Hz
                dm/dt = alpham*(1-m) - betam*m : 1
                
                alphah = kh1*exp(v/sigh1)/ms : Hz
                betah = kh2*(sigh2/mV)/exprel(-(v-thh2)/sigh2)/ms : Hz
                dh/dt = alphah*(1-h) - betah*h : 1
                
                alphan = kn1*(sign1/mV)/exprel(-(v-thn1)/sign1)/ms : Hz
                betan = kn2*exp(v/sign2)/ms : Hz
                dn/dt = alphan*(1-n) - betan*n : 1
                
                alphaa = (siga1/mV)/exprel(-(v-tha1)/siga1)/ms : Hz
                betaa = ka2*exp(v/siga2)/ms : Hz
                da/dt = alphaa*(1-a) - betaa*a : 1
                
                INa = -gNa*m**3*h*(v-ENa) : ampere
                IKv3 = -gKv3*n**4*(v-EK) : ampere
                IKv1 = -gKv1*a**4*(v-EK) : ampere
                IL   = -gL*(v-EL) : ampere

                taum : second
                EL   : volt
                gL   : siemens
                Cap  : farad
                gNa  : siemens
                gKv3 : siemens
                gKv1 : siemens
                thm1 : volt
                thh2 : volt
                thn1 : volt
                tha1 : volt

            ext_eqs: |
                Isin   : ampere
                Inoise : ampere
                # I0     : ampere
                # I=I0+Isin*cos(t/ms * 2*pi/200)+Inoise*rand() : ampere (constant over dt)
                I=Isin*0.5*(1-cos(t/ms * 2*pi/200))+Inoise*rand() : ampere (constant over dt)

            eqs_syn: |
                Isyn_inh = norm_syn_inh*(synb_inh-syna_inh)*(Esyn_inh-v) : amp
                Isyn_exc = norm_syn_exc*(synb_exc-syna_exc)*(Esyn_exc-v) : amp
                dsyna_inh/dt = -syna_inh/tau_syn_a_inh/ms : 1
                dsynb_inh/dt = -synb_inh/tau_syn_b_inh/ms : 1
                dsyna_exc/dt = -syna_exc/tau_syn_a_exc/ms : 1
                dsynb_exc/dt = -synb_exc/tau_syn_b_exc/ms : 1

            volt_eqs: |
                dv/dt = (INa + IKv1 + IKv3 + IL + I + Isyn_inh + Isyn_exc)/Cap : volt

            # gathering all equations together
            general_equ: volt_eqs + gat_vars + ext_eqs + eqs_syn

        specs:
            method: exponential_euler
            threshold: v>-30*mV
            refractory: v>=-30*mV
        initials:
            v: Els + rnd.random(num_neurons)*10*mV
            m: 0.01
            h: 0.99
            n: 0.01
            a: 0.01
            taum : taums
            EL   : Els
            gL   : gLs
            Cap  : taums/Rin
            gNa  : np.array(modelbase["gNa" ])[neuronid]*nS
            gKv3 : np.array(modelbase["gKv3"])[neuronid]*nS
            gKv1 : np.array(modelbase["gKv1"])[neuronid]*nS
            thm1 : np.array(modelbase["thm1"])[neuronid]*mV
            thh2 : np.array(modelbase["thh2"])[neuronid]*mV
            thn1 : np.array(modelbase["thn1"])[neuronid]*mV
            tha1 : np.array(modelbase["tha1"])[neuronid]*mV
            #I0: 229*pA
            #I0: np.array(modelbase["pir_threshold"])[neuronid] * (1.0 + 0.1* np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150) )*pA
            Isin  : 0*pA #-70*pA #229*pA + np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150)*40*pA
            Inoise: 0*pA #70*pA
    
    stl:
        #dencity: 3600e-6*1.5*4
        dencity: 3093.2e-6*1.5*4
        num_neurons: L*H*dencity   # let it be the same for now

        # this model for  layer II/II stellate cells of the medial entorhinal cortex
        # from https://doi.org/10.1023/A:1024474819512        
        const:
            norm_syn_inh: 1*nS
            tau_syn_a_inh: 0.6   # from https://doi.org/10.1523/ENEURO.0441-21.2022
            tau_syn_b_inh: 12.25

            Esyn_inh: -75*mV
            Esyn_exc: 0*mV

            Cm  : 1.5*pF

            ENa :  55*mV
            EK  : -90*mV
            Eh  : -20*mV
            EL  : -65*mV

            gNa : 52*nS
            gK  : 11*nS
            gKs : 2.0*nS
            gh  : 1.5*nS
            gL  : 0.5*nS
            gNap: 0.5*nS
            

        # If you want to add some equation, write it here, but be sure after last equation new line is present
        equations:
            # this model from https://doi.org/10.1023/A:1024474819512
            gat_vars: |
                m_alpha = 1./ exprel( -0.1*(v/mV +23) )    / ms : Hz # -0.1*(v+23)/(exp(-0.1*(v+23)) - 1) 
                m_beta  = 4.*exp(-(v/mV + 48)/18 )         / ms : Hz
                dm/dt   = m_alpha*(1-m) - m_beta*m              : 1
                
                h_alpha = 0.07*exp( -(v/mV + 37)/20 )      / ms : Hz
                h_beta  = 1/( exp( -0.1*(v/mV + 7) ) + 1 ) / ms : Hz
                dh/dt   = h_alpha*(1-h) - h_beta*h              : 1
                
                n_alpha = 0.1 / exprel( -0.1*(v/mV +27) )  / ms : Hz # -0.01*(v+27)/(exp(-0.1*(v+27)) - 1) 
                n_beta  = 0.125 * exp( -(v/mV + 37) / 80 ) / ms : Hz
                dn/dt   = n_alpha*(1-n) - n_beta*n              : 1
                
                p_alpha = 1./(1 + exp( -(v/mV +38)/6.5 ) )                   / 0.15 / ms : Hz
                p_beta  = exp(-(v/mV + 38)/6.5)/(1 +  exp(-(v/mV + 38)/6.5) )/ 0.15 / ms : Hz 
                dp/dt   = p_alpha*(1-p) - p_beta * p            : 1
                
                mKs_inf = 1./(1+exp(-(v/mV+35)/6.5) )           : 1
                dmKs/dt = (mKs_inf - mKs)/90/ms                 : 1
                
                rf_inf  = 1./(1 + exp( (v/mV + 79.2)/9.78 ) )   : 1
                tau_rf  = ( 0.51/( exp((v/mV-1.7)/10) + exp(-(v/mV+340)/52) ) + 1 )*ms : second
                drf/dt  = (rf_inf - rf)/tau_rf                  : 1
                
                rs_inf  = 1./(1 + exp( (v/mV + 71.3)/7.9 ) )    : 1
                tau_rs  = ( 5.60/(exp((v/mV-1.7)/14) + exp(-(v/mV+260)/43) ) + 1 )*ms : second
                drs/dt  = (rs_inf - rs)/tau_rs                  : 1

            ext_eqs: |
                I0   : amp # Overall Excitatory background -- should be below firing onset
                I1   : amp # Short pulse to establish bump attractor
                pstr : second
                pdur : second
                Iapp = I0 + I1*int(t>pstr)*int(t<pstr+pdur) : amp

            eqs_syn: |
                Isyn_inh = norm_syn_inh*(synb_inh-syna_inh)*(Esyn_inh-v) : amp
                dsyna_inh/dt = -syna_inh/tau_syn_a_inh/ms : 1
                dsynb_inh/dt = -synb_inh/tau_syn_b_inh/ms : 1
                #Isyn_exc = norm_syn*(synb_exc-syna_exc)*(Esyn_exc-v) : amp
                #dsyna_exc/dt = -syna_exc/tau_syn_a/ms : 1
                #dsynb_exc/dt = -synb_exc/tau_syn_b/ms : 1
                Isyn = Isyn_inh : amp

            volt_eqs: |
                dv/dt = ((gNa*m**3*h + gNap*p)*(ENa-v) + (gK*n**4+gKs*mKs)*(EK-v) + gh*(0.65*rf+0.35*rs)*(Eh-v) + gL*(EL-v) + Iapp +Isyn)/(Cm) : volt

            # gathering all equations together
            general_equ: gat_vars + volt_eqs + ext_eqs + eqs_syn

        specs:
            method: exponential_euler
            threshold: v>0*mV
            refractory: v>-30*mV
        initials:
            v    : -56.042519934441454*mV
            h    : 0.9610034787263549
            n    : 0.09596337394848327
            p    : 0.05864752345655307
            mKs  : 0.03778554393805423
            rf   : 0.08565812214917566
            rs   : 0.1266038193071342

            #Iapp: 1791*nA #*(1.0 + 0.2* np.exp(-(H*(np.sin(positions[:,0]*np.pi*2/L)+1)/2-positions[:,1])**2/150) )
            I0   : 8*pA
            I1   : 12*exp(-((positions[:,0]-L/2)**2+(positions[:,1]-H/2)**2)/1000)*pA
            pstr : 300*ms #time of initial pulse
            pdur : 20*ms  #pulse duration


                           
synapses:
    stl2pv:
        source: 'stl'     # this is the name of predifined neuron group in this file
        target: 'pvbc'     # this is the name of predifined neuron group in this file
        general:
            model: 'gsyn:1'
            on_pre: |
                    syna_exc_post += gsyn
                    synb_exc_post += gsyn

        geometry:
            type  : "hill_powerlaw"
            pmax  : 0.5506131032856347
            L12   : 144.5691065849716
            power : 17.060179736479995
        conductance:
            type: 'linear'
            offset: 0.000025
            slope: -0.0000001648648649
        delay:
            type: 'linear'
            min: 0.4
            k:   1000 # non myelenated axons

    pv2stl:
        source: 'pvbc'     # this is the name of predifined neuron group in this file
        target: 'stl'     # this is the name of predifined neuron group in this file
        general:
            model: 'gsyn:1'
            on_pre: |
                    syna_inh_post += gsyn
                    synb_inh_post += gsyn

        geometry:
            type  : "hill_powerlaw"
            pmax  : 0.5506131032856347
            L12   : 144.5691065849716
            power : 17.060179736479995
        conductance:
            type: 'linear'
            offset: 0.01 #0.00005
            slope: -0.0000001648648649
        delay:
            type: 'linear'
            min: 0.4
            k:   1000
    
    pv2pv:
        source: 'pvbc'     # this is the name of predifined neuron group in this file
        target: 'pvbc'     # this is the name of predifined neuron group in this file
        general:
            model: 'gsyn:1'
            on_pre: |
                    syna_inh_post += gsyn
                    synb_inh_post += gsyn

        geometry:
            type  : "stretched_exponential"
            pmax  : 0.6751463152220595
            sigma : 159.00552989382751
            power : 8.903913818696052
        conductance:
            type: 'linear'
            offset: 0.00005
            slope: -0.0000001648648649
        delay:
            type: 'linear'
            min: 0.4
            k:   1000
        
################### Simulation and recording parameters #####################

simulation:
    run: True                                        # if run is False, Network is built, so you can investigate it parameters
    time_step: 0.01                                  # simulation time step in ms
    duration: 500                                   # simulation duration in ms

record:
    filename  : stl2pvbc.npz # can be change through command like
    annotation: '' # add annotation to the npz file
    model     : true #safe model file into the npz file
    map       : true #safe map of all recorded variables into the npz file
    spikes:
        pvbc_spikes:
            population: pvbc
        stl_spikes:
            population: stl
    static:
        pvbc_positions:
            object    : pvbc
            variable  : positions
        stl_positions:
            object    : stl
            variable  : positions
        stl2pvbc:
            object    : stl2pv
            variable  : connectivity
        pvbc2pvbc:
            object    : pv2pv
            variable  : connectivity
        stl_I1:
            object    : stl
            variable  : neurons.I1[:]
    states:
        pvbc_voltages:
            object    : pvbc
            variable  : neurons # name of brian object in the population or synapses
            states    : ['v']
            scales    : [1/mV]
            record    : 'np.sort(np.random.choice(num_neurons, 20, replace=False)).tolist()'
        stl_states:
            object    : stl
            variable  : neurons
            states    : ['v','n']
            scales    : [1./mV, 1]
            record    : 'np.sort(np.random.choice(num_neurons, 20, replace=False)).tolist()'

###################         Visualizations              #####################
visualize:
    playback:
        t_start : 0
        t_stop  : null
        dt      : 1.0
        fps     : 30
        tail_time        : 10
        tail_exponential : true #false

    export:
        #Show figures and GUI
        show    : true
        #Export Figures
        figures : true
        prefix  : stl2pvbc
        formats:
            - png
            - svg
        #Export video
        video        : true
        video_prefix : stl2pvbc
        video_format : mp4
        video_fps    : 30
        t_start      : null
        t_stop       : null

    figures:
        spikes:
            size : [12,8]
            grid:
                rows : 2
                cols : 4
            plots:
                plot2D:
                    type : spatial
                    position : [ 0, 0]
                    width  : 2
                    height : 2
                    spatial:
                        pvbc:
                            positions : pvbc_positions
                            spikes    : pvbc_spikes
                            color     : blue
                            size      : 10
                            

                        stl:
                            positions : stl_positions
                            spikes    : stl_spikes
                            color     : stl_I1
                            color_map : Wistia
                            size      : 5
                            marker    : D
                raster:
                    type : raster

                    position : [2,0]

                    width  : 2
                    height : 1

                    raster:
                        stl:
                            spikes : stl_spikes
                            color  : black
                            marker : '.'
                            size   : 1

                        pvbc:
                            spikes : pvbc_spikes
                            color  : blue
                            marker : '.'
                            size   : 1

                voltages:
                    type: trace
                    position : [2,1]

                    width  : 2
                    height : 1

                    offset : 30
                    
                    traces:
                        stl:
                            source : stl_states
                            state  : v
                            color  : black
                            #neurons : 'stl_states_ids[:20]'

                        pvbc:
                            source : pvbc_voltages
                            state  : v
                            color  : blue
                            #neurons : 'pvbc_voltages_ids[:10]'
    
        States: 

            size : [12,8]
            grid:
                rows : 1
                cols : 2
            plots:
                stl_voltages:
                    type: trace
                    position : [0,0]

                    width  : 1
                    height : 2

                    offset : 30
                    
                    traces:
                        stl:
                            source : stl_states
                            state  : v
                            color  : black
                            #neurons : 'stl_states_ids[:20]'
                stl_n:
                    type: trace
                    position : [1,0]

                    width  : 1
                    height : 2

                    offset : 0.5
                    
                    traces:
                        stl:
                            source : stl_states
                            state  : n
                            color  : red
                            #neurons : 'stl_states_ids[:20]'

